[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kova-tts"
version = "0.1.0"
description = "Kova TTS: expressive text-to-speech with voice cloning and LoRA finetuning"
readme = "README.md"
license = "LicenseRef-Kova-Research-NonCommercial"
dynamic = ["license-files"]
requires-python = ">=3.10"
dependencies = [
    "kova-codec",
    "torch>=2.8",
    "transformers>=4.45",
    # Not just for finetuning: loading a LoRA voice for inference goes through peft, so a
    # base install that cannot use `--voice` would be a surprising thing to ship.
    "peft>=0.14",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "scipy>=1.11",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # The WebSocket protocol for uvicorn, the sync client the WebSocket example uses, and --
    # via websockets>=13 -- both from one dependency.
    "websockets>=13.0",
    # fastapi.testclient is httpx-based, so this is what makes `--extra server` enough to run
    # the server's tests without pulling in every other extra.
    "httpx>=0.27",
]
# Gradio 6 for the demo: the theme and stylesheet moved from Blocks() to launch() there, and
# apps/demo/app.py follows the new signature. The rest already arrive with gradio, but the demo
# imports them itself and so declares them: it mounts its Blocks inside a FastAPI application of
# its own, serves the browser's audio from a streaming endpoint next to the page, and reuses
# `kova_tts.server`'s pydantic models for it rather than describing the protocol twice.
demo = [
    "gradio>=6.0",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]
data = ["faster-whisper>=1.1"]
# The training command only. `pyyaml` parses the run config; `accelerate` is never imported
# here but `transformers.Trainer` requires it at runtime. Both already arrive transitively with
# `peft`, which is a base dependency, so this extra costs almost nothing on top of a base
# install. Deliberately no `datasets`: the trainer builds its own dataset over the JSONL corpus
# (`finetune.dataset.build_datasets`) and never imports the library.
finetune = [
    "accelerate>=1.0",
    "pyyaml>=6.0",
]
# Apple Silicon only. The MLX decode backend (`kova_tts.engine.mlx_generator`) and the
# conversion command that feeds it; `mlx` itself arrives with `mlx-lm` but is imported
# directly here, so it is declared. Both wheels are macOS/arm64-only, which is why this is an
# extra rather than a platform-marked base dependency: `uv sync --extra mlx` on Linux should
# fail loudly rather than install nothing and leave `--backend mlx` mysteriously absent.
mlx = [
    "mlx>=0.29",
    "mlx-lm>=0.28",
]

[project.scripts]
kova-tts = "kova_tts.cli:main"

[tool.uv.sources]
kova-codec = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/kova_tts"]

# The shared hook stages root legal files in the ignored build directory. Include
# its implementation in sdists so wheel builds also work outside this workspace.
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
artifacts = ["build/legal/**", "build/_license_metadata.py"]
