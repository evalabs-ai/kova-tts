[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kova-codec = { workspace = true }
kova-tts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
# Documentation only. Kept out of `dev` so a contributor who never builds the site can skip
# it with `uv sync --no-group docs`, and out of the packages' extras so it never lands in a
# runtime install. docs/requirements.txt mirrors this for pip-based builders.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 100
# Both packages declare `requires-python = ">=3.10"`, so this is 3.10 and not the interpreter
# that happens to be installed: a higher target lets the `UP` rules rewrite code into 3.11- or
# 3.12-only forms, which would break the support floor without failing anything here.
target-version = "py310"
# Prose stays under human control; ruff only formats Python.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["kova_codec", "kova_tts"]
# `apps/demo/app.py` puts its own directory on the path and imports its siblings by plain name,
# so they are local modules rather than third-party ones.
known-local-folder = ["content", "session", "streaming", "ui"]

[tool.pytest.ini_options]
testpaths = ["packages/kova-codec/tests", "packages/kova-tts/tests"]
addopts = "-q"
markers = [
    "gpu: requires a CUDA device",
    "weights: requires local or downloaded model weights",
]
