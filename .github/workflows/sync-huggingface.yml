name: Sync Hugging Face model card

on:
  push:
    branches: [main]
    paths:
      - README.md
      - assets/**
      - LICENSE
      - LICENSE-WEIGHTS
      - NOTICE
      - licenses/**
      - scripts/sync_huggingface.py
      - .github/workflows/sync-huggingface.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-kova-tts-1
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'evalabs-ai/kova-tts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hub client
        run: python -m pip install 'huggingface_hub==2.1.1'
      - name: Sync and verify model card, media and licenses
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
        run: python scripts/sync_huggingface.py
